name: Validate and build Anwendung backend with Maven

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compile sources
        run: mvn -B compile test-compile
      - name: Run tests
        run: mvn -B test
      - name: Package artifact
        run: mvn -B -fae -DskipTests=true package

      - name: Report Surefire results
        uses: ScalableCapital/action-surefire-report@4004a71652495d6ed111f5b717c2cf9aa0f37627 # v2.0.5
        if: success() || failure()
